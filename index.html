<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #ffd1dc, #ff9a9e, #fad0c4);
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  text-align: center;
}

/* Soft overlay when popup opens */
.overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: 0.5s;
}

.overlay.active {
  opacity: 1;
}

/* Romantic Button */
.open-btn {
  padding: 15px 35px;
  font-size: 1.2rem;
  border: none;
  border-radius: 40px;
  background: linear-gradient(45deg, #ff2e63, #ff5f9e);
  color: white;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  transition: 0.3s;
  z-index: 2;
}

.open-btn:hover {
  transform: scale(1.1);
}

/* Popup */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(white, #fff0f5);
  width: 90%;
  max-width: 360px;
  padding: 28px 22px;
  border-radius: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.3);
  text-align: center;
  z-index: 5;
  transition: 0.5s ease;
  border: 2px solid #ffb6c1;
}

.popup.active {
  transform: translate(-50%, -50%) scale(1);
}

.popup h1 {
  margin: 0;
  color: #ff2e63;
  font-size: clamp(1.6rem, 5vw, 2.3rem);
  text-shadow: 0 0 8px rgba(255,46,99,0.3);
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px rgba(255,46,99,0.3); }
  to { text-shadow: 0 0 12px rgba(255,46,99,0.6); }
}

/* Falling items */
.fall {
  position: absolute;
  top: -10vh;
  font-size: 24px;
  animation: fallAnim linear forwards;
  pointer-events: none;
  user-select: none;
}

@keyframes fallAnim {
  0% {
    transform: translateY(-10vh) scale(0.8) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) scale(1.2) rotate(360deg);
    opacity: 0;
  }
}

/* 🌹 Animated Rose Bouquet */
.bouquet {
  position: absolute;
  bottom: -120px;
  font-size: 80px;
  animation: riseBouquet 2s ease-out forwards, float 3s infinite ease-in-out;
  opacity: 0;
}

@keyframes riseBouquet {
  from {
    bottom: -120px;
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    bottom: 120px;
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* Floating little message */
.floating-text {
  position: absolute;
  bottom: 20px;
  color: white;
  font-size: 1rem;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<button class="open-btn" onclick="openPopup()">For My Beautiful Rose 💕</button>

<div class="popup" id="popup">
  <h1>🌹 Happy Rose Day Lakshita 🌹</h1>
  <p>
    Like a rose spreads fragrance around,<br>
    You spread love and happiness in my life ❤️<br>
    Forever special… Forever mine 💖
  </p>
  <button class="close-btn" onclick="closePopup()">Close</button>
</div>

<div class="floating-text">Made with love 💕</div>

<script>
function openPopup() {
  document.getElementById('popup').classList.add('active');
  document.getElementById('overlay').classList.add('active');
  startFalling();
  showBouquet();
}

function closePopup() {
  document.getElementById('popup').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
}

// Falling roses & hearts
function createFallItem() {
  const item = document.createElement('div');
  item.classList.add('fall');

  const symbols = ['🌹','❤️','💖','🌹','💘','🌸'];
  item.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

  item.style.left = Math.random() * window.innerWidth + 'px';
  item.style.animationDuration = (4 + Math.random() * 4) + 's';
  item.style.fontSize = (18 + Math.random() * 30) + 'px';

  document.body.appendChild(item);

  setTimeout(() => {
    item.remove();
  }, 8000);
}

function startFalling() {
  setInterval(createFallItem, 250);
}

// 🌹 Show Animated Bouquet
function showBouquet() {
  const bouquet = document.createElement('div');
  bouquet.classList.add('bouquet');
  bouquet.innerHTML = "💐";

  bouquet.style.left = "50%";
  bouquet.style.transform = "translateX(-50%)";

  document.body.appendChild(bouquet);

  setTimeout(() => {
    bouquet.remove();
  }, 6000);
}
</script>

</body>
</html>
