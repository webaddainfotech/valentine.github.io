<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Hug Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle,#ffe6ff,#ffb6ff,#ff9aff);
font-family:'Segoe UI';overflow:hidden;text-align:center;}
.open-btn{padding:15px 35px;border:none;border-radius:40px;
background:linear-gradient(45deg,#da70d6,#ff1493);color:white;font-size:1.2rem;}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
background:white;padding:25px;border-radius:25px;transition:.5s;}
.popup.active{transform:translate(-50%,-50%) scale(1);}
.fall{position:absolute;top:-10vh;animation:fall 6s linear forwards;}
@keyframes fall{to{transform:translateY(110vh);opacity:0;}}
</style>
</head>
<body>
<button class="open-btn" onclick="openPopup()">Give Me a Hug 🤗</button>

<div class="popup" id="popup">
<h1>🤗 Happy Hug Day Lakshita 🤗</h1>
<p>Ek tight hug apke liye 🤗 ❤️</p>
<button class="open-btn" onclick="closePopup()">Hug Back 💖</button>
</div>

<script>
function openPopup(){document.getElementById('popup').classList.add('active');startFall();}
function closePopup(){document.getElementById('popup').classList.remove('active');}
function startFall(){
setInterval(()=>{
const d=document.createElement('div');d.className='fall';
d.innerHTML='🤗';d.style.left=Math.random()*innerWidth+'px';
document.body.appendChild(d);setTimeout(()=>d.remove(),6000);
},300);
}
</script>
</body>
</html>
